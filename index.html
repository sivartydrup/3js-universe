<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Universe Flythrough</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; }

      #hud {
        position: fixed;
        left: 0; bottom: 0;
        padding: 26px 34px;
        pointer-events: none;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      #label {
        font-size: 11px;
        font-weight: 300;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(206, 220, 255, 0.62);
        text-shadow: 0 0 24px rgba(90, 140, 255, 0.35);
        opacity: 0;
        transition: opacity 2s ease;
        white-space: nowrap;
      }
      #label.show { opacity: 1; }
      #label .dim { color: rgba(150, 170, 215, 0.45); }
      #label .seed { color: rgba(140, 160, 205, 0.32); letter-spacing: 0.25em; }

      @media (max-width: 720px) {
        #hud { padding: 18px 20px; }
        #label { font-size: 9px; letter-spacing: 0.22em; white-space: normal; line-height: 1.7; }
        #label .dim, #label .seed { display: block; }
      }

      #boot {
        position: fixed; inset: 0; background: #000; z-index: 10;
        transition: opacity 1.2s ease; pointer-events: none;
      }
      #boot.gone { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="label"></div>
    </div>
    <div id="boot"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
